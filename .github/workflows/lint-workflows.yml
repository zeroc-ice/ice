name: Lint Workflows

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/**"
      - ".gitignore"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/**"
      - ".gitignore"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image bundles the shellcheck that actionlint runs on each run script.
      - name: Run actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:latest -color

      # The token enables the online audits, such as the check that each pinned commit belongs to its action.
      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor --format=github .
