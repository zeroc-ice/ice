name: "Build Brew Packages"

on:
  workflow_call:
    inputs:
      ice_version:
        required: true
        type: string
      channel:
        required: true
        type: string
      quality:
        required: true
        type: string
      run_id:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ice_version:
        description: "The Ice version number to use"
        required: true
      channel:
        description: "The release channel (e.g., 3.9, 3.8)"
        required: true
      quality:
        description: "Release quality (e.g., stable, nightly, RC)"
        required: true
        default: "nightly"
      run_id:
        description: "The run ID to use for downloading the IceGrid GUI dmg artifact"
        required: true

permissions:
  contents: read
  # gh run download reads the build run's artifacts.
  actions: read

jobs:
  build-brew-packages:
    runs-on: macos-26
    # Stable brew release must be build manually.
    if: ${{ inputs.quality == 'nightly' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup C++
        uses: ./.github/actions/setup-cpp

      - name: Download IceGrid GUI DMG
        id: icegridgui
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id }}
          ICE_VERSION: ${{ inputs.ice_version }}
        run: |
          set -o pipefail

          gh run download "$RUN_ID" --repo ${{ github.repository }} --name icegridgui-macos-app --dir staging
          icegridgui_dmg_sha256=$(shasum -a 256 "staging/IceGridGUI-${ICE_VERSION}.dmg" | cut -d ' ' -f 1)

          if [[ -z "$icegridgui_dmg_sha256" ]]; then
            echo "Failed to calculate SHA256 checksum for IceGrid GUI DMG"
            exit 1
          fi

          echo "icegridgui_dmg_sha256=$icegridgui_dmg_sha256" >> "$GITHUB_OUTPUT"

      - name: Update Nightly Tap
        env:
          CHANNEL: ${{ inputs.channel }}
          QUALITY: ${{ inputs.quality }}
          ICE_VERSION: ${{ inputs.ice_version }}
          ICEGRIDGUI_DMG_SHA256: ${{ steps.icegridgui.outputs.icegridgui_dmg_sha256 }}
        run: |
          ./packaging/brew/update-nightly-tap.sh "$CHANNEL" "$QUALITY" "$ICE_VERSION" "$ICEGRIDGUI_DMG_SHA256"

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-bottle
          path: |
            ./*.tar.gz
            ./*.patch
