name: "Build GEM Packages"

on:
  workflow_call:
    inputs:
      ice_version:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ice_version:
        description: "The Ice version to build"
        required: false

permissions:
  contents: read

jobs:
  build-gem-packages:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup C++
        uses: ./.github/actions/setup-cpp

      - name: Setup Ruby
        uses: ./.github/actions/setup-ruby

      - name: Update GEM Version
        working-directory: ruby
        env:
          ICE_VERSION: ${{ inputs.ice_version }}
        run: sed -i "s/spec.version.*/spec.version = '${ICE_VERSION}'/" ice.gemspec
        if: ${{ inputs.ice_version != '' }}

      - name: Build GEM Package
        working-directory: ruby
        run: rake

      - name: Upload Gem Packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gem-packages
          path: ruby/zeroc-ice-*.gem
