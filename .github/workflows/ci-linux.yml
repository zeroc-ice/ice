name: CI Linux

on:
  workflow_dispatch:
  push:
    branches: ["3.7"]
  pull_request:
    branches: ["3.7"]

concurrency:
  group: ci-linux-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.config }} on ${{ matrix.distribution }}-${{ matrix.arch }}
    runs-on: ${{ (contains(matrix.arch, 'arm64') || contains(matrix.arch, 'aarch64')) && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # RPM-based distributions (el9, el10, amzn2023)
          - distribution: el9
            arch: x86_64
            config: shared
            image_type: rpm
          - distribution: el9
            arch: x86_64
            config: cpp11-shared
            image_type: rpm
          - distribution: el9
            arch: aarch64
            config: shared
            image_type: rpm
          - distribution: el9
            arch: aarch64
            config: cpp11-shared
            image_type: rpm

          - distribution: el10
            arch: x86_64
            config: shared
            image_type: rpm
          - distribution: el10
            arch: x86_64
            config: cpp11-shared
            image_type: rpm
          - distribution: el10
            arch: aarch64
            config: shared
            image_type: rpm
          - distribution: el10
            arch: aarch64
            config: cpp11-shared
            image_type: rpm

          - distribution: amzn2023
            arch: x86_64
            config: shared
            image_type: rpm
          - distribution: amzn2023
            arch: x86_64
            config: cpp11-shared
            image_type: rpm
          - distribution: amzn2023
            arch: aarch64
            config: shared
            image_type: rpm
          - distribution: amzn2023
            arch: aarch64
            config: cpp11-shared
            image_type: rpm

          # DEB-based distributions (ubuntu, debian)
          - distribution: ubuntu22.04
            arch: amd64
            config: shared
            image_type: deb
          - distribution: ubuntu22.04
            arch: amd64
            config: cpp11-shared
            image_type: deb
          - distribution: ubuntu22.04
            arch: arm64
            config: shared
            image_type: deb
          - distribution: ubuntu22.04
            arch: arm64
            config: cpp11-shared
            image_type: deb

          - distribution: ubuntu24.04
            arch: amd64
            config: shared
            image_type: deb
          - distribution: ubuntu24.04
            arch: amd64
            config: cpp11-shared
            image_type: deb
          - distribution: ubuntu24.04
            arch: arm64
            config: shared
            image_type: deb
          - distribution: ubuntu24.04
            arch: arm64
            config: cpp11-shared
            image_type: deb

          - distribution: debian12
            arch: amd64
            config: shared
            image_type: deb
          - distribution: debian12
            arch: amd64
            config: cpp11-shared
            image_type: deb
          - distribution: debian12
            arch: arm64
            config: shared
            image_type: deb
          - distribution: debian12
            arch: arm64
            config: cpp11-shared
            image_type: deb

          - distribution: debian13
            arch: amd64
            config: shared
            image_type: deb
          - distribution: debian13
            arch: amd64
            config: cpp11-shared
            image_type: deb
          - distribution: debian13
            arch: arm64
            config: shared
            image_type: deb
          - distribution: debian13
            arch: arm64
            config: cpp11-shared
            image_type: deb

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load version info
        run: |
          source config/version.env
          echo "CHANNEL=$CHANNEL" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: zeroc-ice
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and test (${{ matrix.config }})
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/ice" \
            -w /ice \
            ghcr.io/zeroc-ice/ice-${{ matrix.image_type }}-builder-${{ matrix.distribution }}:${CHANNEL} \
            bash -c "
              set -ex

              # The native language mappings built and tested in addition to C++. Each one is compiled
              # against the interpreter the distribution ships, which is what the distribution packages
              # target. Ice for Python and Ice for PHP use the C++98 mapping, so they are only built in
              # the shared configuration.
              languages='${{ matrix.config == 'shared' && 'python php' || '' }}'

              make CONFIGS=${{ matrix.config }} -j\$(nproc) -C cpp srcs
              make CONFIGS=${{ matrix.config }} -j\$(nproc) -C cpp tests
              for lang in \$languages; do
                make -j\$(nproc) -C \$lang PYTHON=python3
              done

              # The --rfilter option excludes tests matching the regex. These tests are excluded because
              # they require dependencies or permissions not available in the Docker builder images:
              # - IceUtil/priority, Ice/threadPoolPriority: require CAP_SYS_NICE for thread priorities
              # - Glacier2/*: require the passlib Python module
              # - IceSSL/configuration: requires the openssl CLI tool
              rfilter='IceUtil/priority|Ice/threadPoolPriority|Glacier2/|IceSSL/configuration'

              # Every test suite runs even if an earlier one fails, so that a C++ failure does not hide the
              # results of the other mappings; the step fails at the end if any suite failed.
              status=0
              (cd cpp && python3 allTests.py --config=${{ matrix.config }} --workers=4 --debug --continue \
                --rfilter=\$rfilter) || status=1
              for lang in \$languages; do
                (cd \$lang && python3 allTests.py --workers=4 --debug --continue --rfilter=\$rfilter) || status=1
              done
              exit \$status
            "

      - name: Upload test logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-${{ matrix.config }}-${{ matrix.distribution }}-${{ matrix.arch }}
          path: |
            cpp/**/*.log
            python/**/*.log
            php/**/*.log
          if-no-files-found: ignore
        if: always()
