name: "Build Java Packages"

on:
  workflow_call:
    inputs:
      ice_version:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ice_version:
        description: "The Ice version to build"
        required: false

permissions:
  contents: read

jobs:
  build-java-packages:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup C++
        uses: ./.github/actions/setup-cpp

      - name: Setup Java
        uses: ./.github/actions/setup-java

      - name: Build slice2java
        run: make -C cpp slice2java

      - name: Update Ice Version
        env:
          ICE_VERSION: ${{ inputs.ice_version }}
        run: |
          sed -i "s/^iceVersion = .*/iceVersion = ${ICE_VERSION}/" gradle.properties
        working-directory: java
        if: ${{ inputs.ice_version != '' }}

      - name: Build Ice for Java Packages
        run: ./gradlew dist
        working-directory: java

      - name: Upload Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-packages
          path: |
            java/lib/*.jar
            java/lib/*.pom
