name: "Publish NuGet Packages"

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "The release channel (e.g., 3.9, 3.8)"
        required: true
      quality:
        description: "Release quality (e.g., stable, nightly, RC)"
        required: true
        default: "nightly"
      run_id:
        description: "The run ID to use for downloading artifacts"
        required: true
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      quality:
        required: true
        type: string
      run_id:
        required: true
        type: string

permissions:
  contents: read
  # gh run download reads the build run's artifacts.
  actions: read

jobs:
  publish-prerelease:
    name: "Publish NuGet Packages to the ZeroC feed"
    if: inputs.quality != 'stable'
    runs-on: ubuntu-24.04

    steps:
      - name: Download NuGet artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          gh run download "$RUN_ID" --repo ${{ github.repository }} --pattern "*-nuget-packages" --dir staging

      - name: Publish NuGet Packages
        run: |
          SOURCE_URL="https://download.zeroc.com/nexus/repository/nuget-${CHANNEL}-${QUALITY}/"

          mapfile -t packages < <(find staging -type f -name "*.nupkg")

          for package in "${packages[@]}"; do
            echo "Publishing package: $package"
            # The NuGet clients upload every package as "package.nupkg", and Nexus then stores a package that
            # contains PDBs as a symbol package, which clients cannot restore. Sending the real file name avoids
            # it. See https://github.com/sonatype/nexus-public/issues/1058
            curl --fail-with-body -sS -w "\n" -X PUT -H "X-NuGet-ApiKey: $NEXUS_NIGHTLY_NUGET_API_KEY" \
              -F "package=@$package;filename=$(basename "$package")" "$SOURCE_URL"
          done
        env:
          CHANNEL: ${{ inputs.channel }}
          QUALITY: ${{ inputs.quality }}
          NEXUS_NIGHTLY_NUGET_API_KEY: ${{ secrets.NEXUS_NIGHTLY_NUGET_API_KEY }}

  publish-stable:
    name: "Publish NuGet Packages to nuget.org"
    if: inputs.quality == 'stable'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      # NuGet/login exchanges the GitHub OIDC token for a short-lived nuget.org API key (Trusted Publishing).
      id-token: write
    # nuget.org issues a key only to a job that runs in the environment its Trusted Publishing policy names, and
    # that environment can require a reviewer.
    environment: nuget-zeroc

    steps:
      - name: Download NuGet artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          gh run download "$RUN_ID" --repo ${{ github.repository }} --pattern "*-nuget-packages" --dir staging

      # The temporary API key is valid for one hour, so log in right before the push.
      - name: Log in to nuget.org
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          # The nuget.org user who created the Trusted Publishing policy, not the organization that owns it.
          user: ${{ secrets.NUGET_USER }}

      - name: Publish NuGet Packages
        run: |
          # "dotnet nuget push" publishes the symbol package ".snupkg" files automatically with the main package,
          # no need to push them separately.
          mapfile -t packages < <(find staging -type f -name "*.nupkg")

          for package in "${packages[@]}"; do
            echo "Publishing package: $package"
            dotnet nuget push "$package" --source "https://api.nuget.org/v3/index.json" --api-key "$NUGET_API_KEY"
          done
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
