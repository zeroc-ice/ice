name: "Third-Party Windows"

on:
  push:
    branches: ["main"]
    paths:
      - "packaging/windows/third-party/**"
      - ".github/workflows/*third-party*windows*.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "packaging/windows/third-party/**"
      - ".github/workflows/*third-party*windows*.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Builds and packs the packages that a change affects, and uploads nothing: only
# build-third-party-windows-packages.yml produces publishable artifacts. Packing runs here so a broken nuspec or a
# missing file fails on the pull request rather than on release day.
#
# packaging/windows/third-party/select-changed-packages.sh describes which files select which packages. A file shared
# by the packages, such as packages.json or this workflow, selects them all; so does a manual run.
jobs:
  select:
    name: "Select packages"
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      count: ${{ steps.select.outputs.count }}
    steps:
      # A pull request is checked out as a merge commit, whose first parent is the tip of the base branch: a depth
      # of 2 is enough to compare against it.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Select the packages affected by the change
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base=""
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base=$(git rev-parse HEAD^1)
          elif [[ "$EVENT_NAME" == "push" ]]; then
            # Without the previous commit of the branch, build everything.
            if git fetch --quiet --depth=1 origin "$PUSH_BEFORE"; then
              base="$PUSH_BEFORE"
            fi
          fi

          matrix=$(packaging/windows/third-party/select-changed-packages.sh "$base")
          echo "matrix={\"include\":$matrix}" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$matrix" | jq 'length')" >> "$GITHUB_OUTPUT"
          echo "Building:"
          echo "$matrix" | jq -r '.[] | "  " + .package'

  build:
    name: "Build ${{ matrix.package }} (${{ matrix.toolset }})"
    needs: select
    if: ${{ needs.select.outputs.count != '0' }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      # windows-2022 has the v143 toolset only; v142 is an optional Visual Studio component.
      - name: Install the MSVC v142 toolset
        if: ${{ matrix.toolset == 'v142' }}
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstaller = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"

          $installPath = & $vswhere -latest -products * -property installationPath
          if (-not $installPath) { throw "Visual Studio installation not found." }

          & $vsInstaller modify --installPath "$installPath" `
            --add Microsoft.VisualStudio.ComponentGroup.VC.Tools.142.x86.x64 `
            --quiet --wait --norestart

      # The matrix values go through the environment rather than into the command line: this workflow runs on pull
      # requests, and the matrix is built from the packages.json of whatever branch is being tested.
      - name: Build and pack ${{ matrix.package }}
        env:
          PROJECT: ${{ matrix.project }}
          TOOLSET: ${{ matrix.toolset }}
        run: >
          msbuild $env:PROJECT /t:All
          /p:DefaultPlatformToolset=$env:TOOLSET
