name: "Publish RPM Packages"

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "The release channel (e.g., 3.9, 3.8)"
        required: true
      quality:
        description: "Release quality (e.g., stable, nightly, RC)"
        required: true
        default: "nightly"
      run_id:
        description: "The run ID to use for downloading artifacts"
        required: true
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      quality:
        required: true
        type: string
      run_id:
        required: true
        type: string

permissions:
  contents: read
  # gh run download reads the build run's artifacts.
  actions: read

jobs:
  build:
    name: "Publish RPM Packages for ${{ matrix.distribution }}"
    runs-on: 'ubuntu-24.04'
    # Each publish rebuilds the repository metadata from the previous one's, so two must not overlap.
    concurrency:
      group: publish-rpm-${{ inputs.quality }}-${{ inputs.channel }}-${{ matrix.distribution }}
    strategy:
      matrix:
        include:
          - distribution: el9
          - distribution: el10
          - distribution: amzn2023
    env:
      DISTRIBUTION: ${{ matrix.distribution }}
      CHANNEL: ${{ inputs.channel }}
      MCPP_VERSION: v2.7.2.20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ice
          persist-credentials: false

      - name: Download RPM artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          # Download RPM artifacts from the specified run.
          echo "Downloading Ice RPMs from current run..."
          gh run download "$RUN_ID" \
            --repo zeroc-ice/ice \
            --pattern "rpm-packages-${DISTRIBUTION}-*" \
            --dir staging

          # If building for RHEL 9 or 10, also download MCPP RPMs.
          if [[ "$DISTRIBUTION" == "el9" || "$DISTRIBUTION" == "el10" ]]; then
            echo "Also downloading MCPP RPMs for $DISTRIBUTION..."

            # MCPP packages
            MCPP_PACKAGES="rpm-packages-3.8-${DISTRIBUTION}-*"
            gh release download "$MCPP_VERSION" \
              --repo zeroc-ice/mcpp \
              --pattern "$MCPP_PACKAGES" \
              --dir staging/mcpp

            # gh doesn't automatically extract release downloads
            pushd staging/mcpp > /dev/null
            for zip in ${MCPP_PACKAGES}.zip; do unzip -q "$zip"; done
            popd > /dev/null
          fi

      - name: Create RPM repository
        shell: bash
        run: |
          if [ "${QUALITY}" = "stable" ]; then
            UPLOAD_PATH="ice/${CHANNEL}/${DISTRIBUTION}"
          else
            UPLOAD_PATH="ice/${QUALITY}/${CHANNEL}/${DISTRIBUTION}"
          fi

          repo_dirs=(x86_64 aarch64 SRPMS)

          # create-rpm-repo.sh reuses the metadata entries of the published packages. The only ones downloaded are those
          # the metadata doesn't list, for createrepo_c to read: a publish interrupted before its metadata upload leaves
          # such packages.
          echo "Fetching the current repository metadata from S3..."
          mkdir -p "${DISTRIBUTION}" published
          aws s3 sync "s3://${S3_DOWNLOADS_BUCKET}/${UPLOAD_PATH}" "${DISTRIBUTION}" --exclude "*" --include "*/repodata/*"
          for dir in "${repo_dirs[@]}"; do
            aws s3api list-objects-v2 \
              --bucket "${S3_DOWNLOADS_BUCKET}" \
              --prefix "${UPLOAD_PATH}/${dir}/" \
              --delimiter / \
              --output json | jq -r '.Contents[]?.Key | select(endswith(".rpm")) | split("/") | last' | sort > "published/${dir}.txt"
            # Only the primary that repomd.xml names counts: an interrupted metadata upload can leave another one.
            repomd="${DISTRIBUTION}/${dir}/repodata/repomd.xml"
            if [ -f "${repomd}" ]; then
              primary=$(sed -n '/<data type="primary">/,/<\/data>/s/.*<location href="\([^"]*\)".*/\1/p' "${repomd}")
              zcat "${DISTRIBUTION}/${dir}/${primary}" | sed -n 's/.*<location [^>]*href="\([^"]*\)".*/\1/p' | sort > listed.txt
            else
              : > listed.txt
            fi
            comm -23 "published/${dir}.txt" listed.txt | while read -r name; do
              aws s3 cp "s3://${S3_DOWNLOADS_BUCKET}/${UPLOAD_PATH}/${dir}/${name}" "${DISTRIBUTION}/${dir}/${name}"
            done
          done

          echo "Creating/updating repository with new RPMs..."
          docker_args=(
            --rm
            -v "$GITHUB_WORKSPACE:/workspace"
            -e GPG_KEY="${GPG_KEY}"
            -e GPG_KEY_ID="${GPG_KEY_ID}"
            "ghcr.io/zeroc-ice/rpm-repo-builder:${CHANNEL}"
          )
          docker run "${docker_args[@]}" /workspace/ice/packaging/rpm/create-rpm-repo.sh \
            --staging /workspace/staging/ \
            --repository "/workspace/${DISTRIBUTION}" \
            --published /workspace/published

          # The packages go first, so the metadata never lists a package that is not uploaded yet. In each repodata/,
          # repomd.xml follows the files it names and the files it no longer names go last, so the metadata in S3 always
          # loads, even when the upload is interrupted.
          echo "Uploading the new packages, then the updated metadata, to S3..."
          aws s3 sync "${DISTRIBUTION}" "s3://${S3_DOWNLOADS_BUCKET}/${UPLOAD_PATH}" --exclude "*/repodata/*"
          for dir in "${repo_dirs[@]}"; do
            repodata="s3://${S3_DOWNLOADS_BUCKET}/${UPLOAD_PATH}/${dir}/repodata"
            aws s3 sync "${DISTRIBUTION}/${dir}/repodata" "${repodata}" --exclude "repomd.xml*"
            aws s3 sync "${DISTRIBUTION}/${dir}/repodata" "${repodata}" --exclude "*" --include "repomd.xml*"
            aws s3 sync "${DISTRIBUTION}/${dir}/repodata" "${repodata}" --delete
          done
        env:
          CHANNEL: ${{ inputs.channel }}
          QUALITY: ${{ inputs.quality }}
          S3_DOWNLOADS_BUCKET: ${{ vars.S3_DOWNLOADS_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GPG_KEY: ${{ secrets.ICE_3_8_CI_SIGNER_KEY }}
          GPG_KEY_ID: ${{ secrets.ICE_3_8_CI_SIGNER_KEY_ID }}
