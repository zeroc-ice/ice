name: "Build Third-Party Windows Packages"

# Builds the packages a release is published from, and uploads them. It never publishes anything:
# publish-third-party-windows-packages.yml does that, from the artifacts of a run of this workflow.
#
# Dispatched by hand, and deliberately not reachable from a push or a pull request. Publishing takes a run id, so a
# run that uploads a .nupkg is a run someone can publish from; keeping this workflow off the pull request path is
# what stops a proposed change becoming a publishable artifact. CI builds and packs every package on every pull
# request that changes the third-party packaging -- it just keeps nothing.
#
# The packages are built from one job definition driven by packaging/third-party/windows/packages.json.
# They differ only in which project is built and how the result is signed. Dependencies move at their own pace, so `package` selects one of
# them; the default builds all of them.
#
# Notes on the entries in packages.json:
#   - sign_filter is the file extension Authenticode signing covers. ZeroC.LMDB is a static library with nothing to
#     sign, so its filter is empty and the signing step is skipped. Signing is not optional otherwise: the only
#     reason to dispatch this workflow is to produce a release, and CI already covers building and packing. A
#     signed build needs the AZURE_* secrets; these must be available to this repository.
#   - ZeroC.LMDB.Tools is built with MinGW-w64 rather than MSVC, so its toolset is not an MSVC platform toolset.
#     See packaging/third-party/windows/lmdb/lmdb-tools.proj for why.

on:
  workflow_dispatch:
    inputs:
      package:
        description: "The package to build"
        required: false
        type: choice
        default: "all"
        options:
          - all
          - ZeroC.Bzip2
          - ZeroC.Expat
          - ZeroC.LMDB
          - ZeroC.LMDB.Tools

permissions:
  contents: read

jobs:
  select:
    name: "Select packages"
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select the packages to build
        id: select
        env:
          PACKAGE: ${{ inputs.package || 'all' }}
        run: |
          if [ "$PACKAGE" = "all" ]; then
            selected=$(jq -c '.' packaging/third-party/windows/packages.json)
          else
            selected=$(jq -c --arg p "$PACKAGE" '[.[] | select(.package == $p)]' packaging/third-party/windows/packages.json)
          fi

          if [ "$(echo "$selected" | jq 'length')" -eq 0 ]; then
            echo "::error::No package named '$PACKAGE' in packaging/third-party/windows/packages.json"
            exit 1
          fi

          echo "matrix={\"include\":$selected}" >> "$GITHUB_OUTPUT"
          echo "Building:"
          echo "$selected" | jq -r '.[] | "  " + .package'

  build:
    name: "Build ${{ matrix.package }} (${{ matrix.toolset }})"
    needs: select
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      # The runner image ships MSYS2 but not necessarily its MinGW-w64 toolchain, so install it explicitly rather
      # than depending on what the image happens to contain.
      - name: Install the MinGW-w64 toolchain
        if: ${{ matrix.toolset == 'mingw64' }}
        run: |
          & "C:\msys64\usr\bin\bash.exe" -lc "pacman -Sy --noconfirm && pacman -S --noconfirm --needed mingw-w64-x86_64-gcc"
          if ($LASTEXITCODE -ne 0) { throw "pacman failed with exit code $LASTEXITCODE" }

          # The gcc driver spawns cc1 and the assembler from alongside itself, so its directory has to be on PATH.
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"

          & "C:\msys64\mingw64\bin\gcc.exe" --version | Select-Object -First 1

          # Prove the toolchain works before MSBuild uses it, so a broken toolchain reports its own error here
          # rather than surfacing as an opaque MSBuild exit code.
          "int main(void) { return 0; }" | Out-File -FilePath "$env:RUNNER_TEMP\smoke.c" -Encoding ascii
          & "C:\msys64\mingw64\bin\gcc.exe" -static -o "$env:RUNNER_TEMP\smoke.exe" "$env:RUNNER_TEMP\smoke.c"
          if ($LASTEXITCODE -ne 0) { throw "the MinGW-w64 toolchain cannot compile a trivial program" }
          Write-Host "MinGW-w64 toolchain OK"

      # The matrix values go through the environment rather than into the command line. Nothing untrusted reaches
      # this workflow -- it cannot be triggered by a pull request -- but the same steps exist in
      # third-party-windows.yml, where something can, and the two should not drift apart.
      - name: Build ${{ matrix.package }}
        env:
          PROJECT: ${{ matrix.project }}
          TOOLSET: ${{ matrix.toolset }}
          PACKAGE: ${{ matrix.package }}
        run: >
          msbuild $env:PROJECT /t:Build
          /p:DefaultPlatformToolset=$env:TOOLSET
          /p:PackageName=$env:PACKAGE

      # Signing sits between building and packing, so the signatures end up inside the package. The pack target
      # deliberately does not rebuild, which would otherwise replace the signed binaries.
      - name: Sign ${{ matrix.package }} binaries with Trusted Signing
        if: ${{ matrix.sign_filter != '' }}
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: zeroc
          certificate-profile-name: zeroc-ice
          files-folder: ${{ github.workspace }}\packaging\third-party\windows\out\${{ matrix.dependency }}
          files-folder-filter: ${{ matrix.sign_filter }}
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Pack ${{ matrix.package }}
        env:
          PROJECT: ${{ matrix.project }}
          TOOLSET: ${{ matrix.toolset }}
          PACKAGE: ${{ matrix.package }}
        run: >
          msbuild $env:PROJECT /t:NugetPack
          /p:DefaultPlatformToolset=$env:TOOLSET
          /p:PackageName=$env:PACKAGE

      # The signing action reports success when its filter matches nothing, so a wrong folder or filter would
      # produce an unsigned release that looks like a signed one. This checks the staging directory rather than
      # the build tree, so what is checked is what was packed.
      - name: Verify ${{ matrix.package }} is signed
        if: ${{ matrix.sign_filter != '' }}
        env:
          STAGING: packaging\third-party\windows\out\${{ matrix.dependency }}\${{ matrix.package }}
          FILTER: ${{ matrix.sign_filter }}
        run: |
          $files = @(Get-ChildItem -Path $env:STAGING -Filter "*.$env:FILTER" -Recurse -File)
          if ($files.Count -eq 0) {
            throw "No .$env:FILTER files under $env:STAGING, so nothing was packed for signing to cover."
          }

          $invalid = @()
          foreach ($file in $files) {
            $status = (Get-AuthenticodeSignature -LiteralPath $file.FullName).Status
            Write-Host ("  {0,-12} {1}" -f $status, (Resolve-Path -Relative $file.FullName))
            # NotTrusted can be a trust-chain issue on the runner while still proving that the signed digest
            # matches. Every other non-Valid status means the signature is absent, damaged or cannot be verified.
            if ($status -notin @('Valid', 'NotTrusted')) { $invalid += $file.FullName }
          }

          if ($invalid.Count -gt 0) {
            throw "$($invalid.Count) of $($files.Count) packaged .$env:FILTER files have an absent or invalid signature."
          }
          Write-Host "All $($files.Count) packaged .$env:FILTER files have an intact signature."

      - name: Upload ${{ matrix.package }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: third-party-windows-package-${{ matrix.package }}
          path: packaging/third-party/windows/out/${{ matrix.dependency }}/${{ matrix.package }}/*.nupkg
          if-no-files-found: error

  # A successful run gets this marker only after every selected package has been built, signed where applicable,
  # packed and uploaded. The publish workflow requires it, which makes artifacts from older versions
  # of this workflow ineligible even if they have not expired yet.
  provenance:
    name: "Record publish provenance"
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Write provenance
        env:
          WORKFLOW_PATH: ".github/workflows/build-third-party-windows-packages.yml"
        run: |
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --arg head_sha "$GITHUB_SHA" \
            --arg workflow_path "$WORKFLOW_PATH" \
            '{schema: 1, repository: $repository, run_id: $run_id, head_sha: $head_sha, workflow_path: $workflow_path}' \
            > publish-provenance.json

      - name: Upload publish provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: third-party-windows-publish-provenance-v1
          path: publish-provenance.json
          if-no-files-found: error
