name: Nightly Release

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number for nightly releases"
        required: false
        default: "1"
      publish:
        description: "Prune old nightly artifacts and publish the new packages"
        required: false
        default: false
        type: boolean
      authenticode_sign:
        description: "Sign Windows binaries with Authenticode"
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build Release
    uses: ./.github/workflows/build-release.yml
    with:
      quality: nightly
      build_number: ${{ inputs.build_number }}
      authenticode_sign: ${{ inputs.authenticode_sign }}
    secrets: inherit

  prune:
    name: Prune Nightly Artifacts
    if: ${{ inputs.publish == true }}
    needs: build
    uses: ./.github/workflows/prune-nightly-artifacts.yml
    with:
      channel: ${{ needs.build.outputs.channel }}
    secrets: inherit

  publish:
    name: Publish Release
    # Pruning removes dated RPM packages and loose artifacts without updating
    # repository metadata. Publishing must run afterwards to rebuild it. The
    # APT repositories are not touched by the prune: reprepro removes expired
    # nightly packages during publish, keeping metadata and pool consistent.
    if: ${{ inputs.publish == true }}
    needs:
      - build
      - prune
    uses: ./.github/workflows/publish-release.yml
    with:
      channel: ${{ needs.build.outputs.channel }}
      quality: nightly
      run_id: ${{ github.run_id }}
    secrets: inherit
