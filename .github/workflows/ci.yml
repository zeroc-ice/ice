name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: ["main"]

# See https://docs.github.com/en/actions/using-jobs/using-concurrency#example-using-a-fallback-value
concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  # Configure the various build systems to treat warnings as errors
  WARNINGS_AS_ERRORS: yes

jobs:
  ci:
    name: ${{ matrix.config }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Release builds
          - os: macos-26
            config: "release"
            # We want to test C++ and Swift only (in each direction)
            cross_test_flags: "--all-cross --filter cpp --filter swift"
            python_tests: true
          - os: ubuntu-24.04
            config: "release"
            cross_test_flags: "--all-cross"
          - os: ubuntu-24.04-arm
            config: "release"
            build_flags: "SKIP=csharp" # Skip C# on ARM as .NET compiler keeps crashing
            test_flags: "--rfilter=csharp"
            python_tests: true
          - os: windows-2022
            config: "release"
            build_flags: "/p:Platform=x64"
            test_flags: "--platform=x64"
            python_tests: true
          - os: windows-2022
            config: "cpp-win32-release"
            working_directory: "cpp"
            build_flags: "/p:Platform=Win32"
            msbuild_project: "msbuild/ice.proj"
            test_flags: "--platform=Win32"
            python_tests: true
          - os: windows-2025
            config: "release"
            build_flags: "/p:Platform=x64"
            test_flags: "--platform=x64"
            python_tests: true

          # Debug builds
          - os: macos-26
            config: "debug"
            build_flags: "OPTIMIZE=no"
            test_flags: "--swift-config=debug --csharp-config=Debug"
            python_tests: true
            enable_csharp_analysis: true
          - os: ubuntu-24.04
            config: "debug"
            build_flags: "OPTIMIZE=no"
            test_flags: "--csharp-config=Debug"
            python_tests: true
            enable_csharp_analysis: true

          # TODO - figure out how to properly install debug Python
          - os: windows-2022
            config: "debug"
            working_directory: "cpp"
            build_flags: "/p:Platform=x64 /p:Configuration=Debug"
            test_flags: "--platform=x64 --config=Debug"
            msbuild_project: "msbuild/ice.proj"
            python_tests: true
            enable_csharp_analysis: true

          # iOS
          - os: macos-26
            config: "ios"
            build_flags: "OPTIMIZE=no PLATFORMS='macosx iphonesimulator' CONFIGS='static shared' LANGUAGES='cpp swift'"
            test_flags: "--languages='cpp,swift' --config=debug --platform=iphonesimulator --controller-app"
            build_cpp_and_python: true

          # Static builds
          - os: ubuntu-24.04
            config: "static"
            build_flags: "CONFIGS=static"
            test_flags: "--config=static --filter=Ice/ --filter=IceDiscovery/"
            working_directory: "cpp"

          # MATLAB
          - os: ubuntu-24.04
            config: "matlab"
            working_directory: "matlab"
            build_cpp_and_python: true
          - os: windows-2022
            config: "matlab"
            working_directory: "matlab"
            build_flags: "/p:Platform=x64"
            msbuild_project: "msbuild/ice.proj"
            test_flags: "--platform=x64"
            build_cpp_and_python: true

          - os: ubuntu-24.04
            config: "android"
            working_directory: "java"
            test_flags: "--android --controller-app"
            build_cpp_and_python: true
            build_android_controller: true

          # Android<->Android IceBT over the emulator's virtual Bluetooth controller: one emulator
          # runs the test server (started by setup-android-bt), the other runs the client.
          - os: ubuntu-24.04
            config: "android-bt"
            working_directory: "java"
            build_cpp_and_python: true
            build_android_controller: true
            test_workers: 1
            skip_all_configs: true
            job_timeout: 60 # ~2x the observed runtime, to bound a wedged emulator
            # setup-android-bt exports $BT_CLIENT and $BT_ADDR; these flags are interpolated into a bash
            # command, so the shell expands them at run time.
            #
            # The suites are every id in Component.isCross (scripts/Component.py) -- the full set a
            # --cross run can pair with a server, so nothing eligible is left untested. Keep this
            # list and cpp-bt's in step with that function if it gains an entry.
            test_flags: >-
              --android --controller-app --protocol=bt --cross=java --server=server
              --device=$BT_CLIENT --host-bt=$BT_ADDR
              Ice/operations Ice/ami Ice/enums Ice/exceptions Ice/facets
              Ice/inheritance Ice/invoke Ice/objects Ice/optional Ice/proxy
              Ice/slicing/exceptions Ice/slicing/objects
            # bts is the same RFCOMM transport with SSL layered over it. The controller app bundles
            # the keystores it needs (res/raw/*.p12), so this only needs the protocol switched. Kept
            # to the core suites: it covers the SSL-over-Bluetooth path, not the marshalling again.
            bts_test_flags: >-
              --android --controller-app --protocol=bts --cross=java --server=server
              --device=$BT_CLIENT --host-bt=$BT_ADDR
              Ice/operations Ice/ami

          # .NET 10.0
          - os: ubuntu-24.04
            config: ".NET10"
            working_directory: "csharp"
            net_target_framework: "net10.0"
            test_flags: "--target-framework=net10.0"
            build_cpp_and_python: true

          - os: windows-2025
            config: ".NET10"
            working_directory: "csharp"
            msbuild_command: "dotnet msbuild"
            build_flags: "/p:Platform=x64"
            msbuild_project: "msbuild/ice.proj"
            net_target_framework: "net10.0"
            test_flags: "--target-framework=net10.0"
            build_cpp_and_python: true

          - os: macos-26
            config: ".NET10"
            working_directory: "csharp"
            net_target_framework: "net10.0"
            test_flags: "--target-framework=net10.0"
            build_cpp_and_python: true

          # C++ IceBT over a pair of virtual Bluetooth controllers. arm64 only: the runners' azure
          # kernel ships the Bluetooth modules in linux-modules-extra for arm64 but not for amd64.
          #
          # Its own job rather than steps bolted onto `release on ubuntu-24.04-arm`, which already
          # builds the same thing on the same OS and arch. That duplicated build is most of the
          # runtime -- ~20 min of a ~23 min job, for ~50 s of Bluetooth testing -- so folding it in
          # is worth revisiting; what keeps it separate now is only that a broken Bluetooth stack
          # cannot take the arm64 release job down with it.
          - os: ubuntu-24.04-arm
            config: "cpp-bt"
            working_directory: "cpp"
            build_cpp_and_python: true
            test_workers: 1
            skip_all_configs: true
            job_timeout: 45 # ~2x the observed runtime, to bound a wedged setup
            # --cross=cpp skips the collocated case, which has no server side and so leaves
            # Ice.Default.Host as an IP address IceBT rejects. The suites are Component.isCross in
            # full, matching android-bt, so both transports cover the same ground.
            test_flags: >-
              --server=server --protocol=bt --cross=cpp --host-bt=$BT_ADDR
              Ice/operations Ice/ami Ice/enums Ice/exceptions Ice/facets
              Ice/inheritance Ice/invoke Ice/objects Ice/optional Ice/proxy
              Ice/slicing/exceptions Ice/slicing/objects
            bts_test_flags: >-
              --server=server --protocol=bts --cross=cpp --host-bt=$BT_ADDR
              Ice/operations Ice/ami

    runs-on: ${{ matrix.os }}
    # Only the Bluetooth jobs set job_timeout; everything else keeps GitHub's default. These sit
    # deliberately below the sum of their steps' own caps (cpp-bt 45 against 180, android-bt 60
    # against 190), so the job cap is what bounds a wedged run. Keep them well above the job's
    # normal runtime even so: a job killed here skips the always() diagnostics and upload steps.
    timeout-minutes: ${{ matrix.job_timeout || 360 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Print System Info
        uses: ./.github/actions/system-info

      - name: macOS FQDN Fix
        uses: ./.github/actions/macos-fqdn
        if: runner.os == 'macOS'

      - name: Disk space before setup
        run: df -h
        shell: bash

      # Free up disk space to avoid running out of space when starting the Android emulator for tests
      - name: Free up disk space
        if: startsWith(matrix.config, 'android')
        run: |
          sudo rm -rf /usr/local/go* /opt/hostedtoolcache/go
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/share/dotnet
          df -h
        shell: bash

      - name: Setup C++
        uses: ./.github/actions/setup-cpp

      - name: Setup PHP
        uses: ./.github/actions/setup-php

      - name: Setup Python
        uses: ./.github/actions/setup-python

      - name: Setup .NET
        if: ${{ !startsWith(matrix.config, 'android') }}
        uses: ./.github/actions/setup-dotnet
        with:
          include_net10: ${{ matrix.net_target_framework == 'net10.0' }}

      - name: Setup Java
        uses: ./.github/actions/setup-java

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Setup Ruby
        if: runner.os != 'Windows'
        uses: ./.github/actions/setup-ruby

      - name: Setup MATLAB
        if: matrix.config == 'matlab'
        uses: ./.github/actions/setup-matlab

      - name: Setup Android
        if: startsWith(matrix.config, 'android')
        uses: ./.github/actions/setup-android

      - name: Install Windows Debug Tools
        if: runner.os == 'Windows'
        uses: ./.github/actions/install-windows-debug-tools

      - name: Install ice-builder-xcode
        run: |
          #TODO: We should consider removing the dependency on ice-builder-xcode
          brew install zeroc-ice/tap/ice-builder-xcode
        shell: bash
        if: (runner.os == 'macOS') && (matrix.config == 'ios')

      - name: Setup Cache
        uses: ./.github/actions/setup-cache
        with:
          prefix: ci-${{ matrix.config }}

      - name: Disk space after setup
        run: df -h
        shell: bash

      # See https://learn.microsoft.com/en-us/windows/win32/wer/collecting-user-mode-dumps
      - name: Enable Windows crash dumps
        run: |
          reg add "HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" /v DumpType /t REG_DWORD /d 2 /f
          reg add "HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" /v DumpFolder /t REG_EXPAND_SZ /d ${{ github.workspace }}\LocalDumps /f
          reg add "HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\Windows Error Reporting" /v DontShowUI /t REG_DWORD /d 1 /f
        shell: powershell
        if: runner.os == 'Windows'

      - name: Enable C# Analysis
        if: matrix.enable_csharp_analysis == true
        run: |
          echo "EnableAnalysis=true" >> $env:GITHUB_ENV
        shell: pwsh

      - name: .NET Target Framework
        if: matrix.net_target_framework == 'net10.0'
        run: |
          echo "AppTargetFramework=net10.0" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Build ${{ matrix.config }} on ${{ matrix.os }}
        uses: ./.github/actions/build
        timeout-minutes: 90
        with:
          working_directory: ${{ matrix.working_directory || '.' }}
          build_cpp_and_python: ${{ matrix.build_cpp_and_python || false }}
          build_android_controller: ${{ matrix.build_android_controller || false }}
          build_flags: ${{ matrix.build_flags || '' }}
          msbuild_command: ${{ matrix.msbuild_command || 'msbuild /m' }}
          msbuild_project: ${{ matrix.msbuild_project || 'ice.proj' }}

      - name: Install testing dependencies from pip
        run: python3 -m pip install passlib cryptography numpy
        shell: bash

      # Boots and bonds the emulator pair and starts the server-side process controller, so the
      # test step below only has to run the client.
      - name: Setup Android Bluetooth
        if: matrix.config == 'android-bt'
        timeout-minutes: 30
        uses: ./.github/actions/setup-android-bt

      - name: Setup virtual Bluetooth controllers
        if: matrix.config == 'cpp-bt'
        timeout-minutes: 20
        uses: ./.github/actions/setup-vhci

      - name: Test ${{ matrix.config }} on ${{ matrix.os }}
        uses: ./.github/actions/test
        timeout-minutes: 45
        # Scoped to this step rather than exported from setup-vhci into $GITHUB_ENV: there it would
        # also apply to the crash-dump step, where coredumpctl needs the real system bus to find
        # systemd. Only cpp-bt's client belongs on the second daemon; every other job gets an empty
        # value, which nothing in their test steps reads.
        env:
          DBUS_SYSTEM_BUS_ADDRESS: ${{ matrix.config == 'cpp-bt' && 'unix:path=/tmp/bus2.sock' || '' }}
        with:
          working_directory: ${{ matrix.working_directory || '.' }}
          flags: ${{ matrix.test_flags }}
          workers: ${{ matrix.test_workers || 4 }}
          # Bluetooth opts out: --all fans each suite over configurations that don't apply to it.
          # The polarity is load-bearing -- the natural-looking `matrix.test_all != false` reads
          # null != false as 0 != 0, silently dropping --all from every job in the matrix.
          all: ${{ matrix.skip_all_configs != true }}

      # Runs before the diagnostics step so a bts failure still gets the adb/logcat dump.
      - name: Test ${{ matrix.config }} over bts on ${{ matrix.os }}
        if: matrix.bts_test_flags != ''
        uses: ./.github/actions/test
        timeout-minutes: 20
        env:
          DBUS_SYSTEM_BUS_ADDRESS: ${{ matrix.config == 'cpp-bt' && 'unix:path=/tmp/bus2.sock' || '' }}
        with:
          working_directory: ${{ matrix.working_directory || '.' }}
          flags: ${{ matrix.bts_test_flags }}
          workers: ${{ matrix.test_workers || 4 }}
          # Bluetooth opts out: --all fans each suite over configurations that don't apply to it.
          # The polarity is load-bearing -- the natural-looking `matrix.test_all != false` reads
          # null != false as 0 != 0, silently dropping --all from every job in the matrix.
          all: ${{ matrix.skip_all_configs != true }}

      - name: Bluetooth diagnostics
        if: always() && matrix.config == 'android-bt'
        timeout-minutes: 5
        run: |
          set +e
          echo "=== controller.log ==="; tail -40 controller.log
          echo "=== emu_client.log ==="; tail -20 emu_client.log
          echo "=== emu_server.log ==="; tail -20 emu_server.log
          export PYTHONPATH="$GITHUB_WORKSPACE/python/python"
          for d in "$BT_CLIENT" "$BT_SERVER"; do
            echo "==================== $d ===================="
            # `set +e` above stops the script aborting, but the step still exits with the status of
            # its last command -- so keep the loop's status clean or diagnostics alone fails the job.
            timeout 60 python3 scripts/Controller.py --android --device="$d" --bt-diagnostics || true
          done
        shell: bash

      # The setup step's own failures are self-reporting; this covers a *test* failure, where
      # nothing so far says whether the controllers, the bond, or the daemons are still healthy.
      - name: Virtual Bluetooth diagnostics
        if: always() && matrix.config == 'cpp-bt'
        timeout-minutes: 5
        run: |
          # As above: keep the last command's status clean or diagnostics alone fails the job.
          set +e
          echo "=== controllers ==="; hciconfig -a
          echo "=== bond ==="; sudo find /var/lib/bluetooth -name info -exec sh -c \
            'echo "--- $1"; cat "$1"' _ {} \;
          # -f: Controller.py runs as python3, so its name alone never matches.
          echo "=== processes ==="; pgrep -af "btvirt|bluetoothd|bt-agent|Controller.py"
          echo "=== system bus ==="; sudo busctl --system tree org.bluez 2>&1 | head -20
          echo "=== private bus ==="
          sudo DBUS_SYSTEM_BUS_ADDRESS=unix:path=/tmp/bus2.sock \
            busctl --system tree org.bluez 2>&1 | head -20
          for f in btvirt bluetoothd2 bt-agent bt-agent2 controller; do
            echo "=== $f.log ==="; tail -20 "$GITHUB_WORKSPACE/$f.log"
          done
          true
        shell: bash

      - name: Cross Test ${{ matrix.config }} on ${{ matrix.os }}
        uses: ./.github/actions/test
        timeout-minutes: 30
        with:
          working_directory: ${{ matrix.working_directory || '.' }}
          flags: ${{ matrix.cross_test_flags }}
        if: matrix.cross_test_flags != ''

      - name: Remove Python tests generated code
        run: |
          # Remove generated files from previous runs before to test with loadSlice
          # to ensure we use the dynamically generated code.
          find python/test -name generated -exec rm -rfv {} +
        shell: bash
        if: matrix.python_tests == true

      - name: Python Test with loadSlice ${{ matrix.config }} on ${{ matrix.os }}
        uses: ./.github/actions/test
        timeout-minutes: 45
        with:
          working_directory: ${{ matrix.working_directory || '.' }}
          flags: "${{ matrix.test_flags }} --load-slice --language=python"
        if: matrix.python_tests == true

      - name: Generate API Reference
        uses: ./.github/actions/documentation
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-s3-code-bucket: ${{ secrets.AWS_S3_CODE_BUCKET }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        if: matrix.config == 'release' && runner.os == 'macOS'

      # The MATLAB API reference is generated separately because the MATLAB mapping does not build on macOS.
      - name: Generate MATLAB API Reference
        uses: ./.github/actions/matlab-documentation
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-s3-code-bucket: ${{ secrets.AWS_S3_CODE_BUCKET }}
        if: matrix.config == 'matlab' && runner.os == 'Linux'

      - name: Upload test logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-logs-${{ matrix.config }}-${{ matrix.os }}
          path: ${{ '.' }}/**/*.log
          if-no-files-found: ignore
        if: always()

      - name: Process Linux crash dumps
        if: runner.os == 'Linux' && always()
        timeout-minutes: 15
        run: |
          python3 scripts/process_linux_crash_dumps.py \
              --workspace $GITHUB_WORKSPACE \
              --reports LinuxDumpReports \
              -v
        shell: bash

      - name: Upload Linux crash dump reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crash-dumps-${{ matrix.config }}-${{ matrix.os }}
          path: ${{ github.workspace }}/LinuxDumpReports/*
          if-no-files-found: ignore
        if: runner.os == 'Linux' && always()

      - name: Upload macOS crash diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crash-diagnostics-${{ matrix.config }}-${{ matrix.os }}
          path: ~/Library/Logs/DiagnosticReports/*.ips
          if-no-files-found: ignore
        if: runner.os == 'macOS' && always()

      - name: Process Windows crash dumps
        if: runner.os == 'Windows' && always()
        timeout-minutes: 15
        shell: pwsh
        run: |
          $dumpDir   = Join-Path $env:GITHUB_WORKSPACE 'LocalDumps'
          $reportsDir = Join-Path $env:GITHUB_WORKSPACE 'LocalDumpReports'

          python scripts\process_windows_crash_dumps.py `
              --dumps     $dumpDir `
              --workspace $env:GITHUB_WORKSPACE `
              --reports   $reportsDir `
              --cdb "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe" `
              -v

      - name: Upload Windows crash dump reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crash-dumps-${{ matrix.config }}-${{ matrix.os }}
          path: ${{ github.workspace }}/LocalDumpReports/*
          if-no-files-found: ignore
        if: runner.os == 'Windows' && always()
