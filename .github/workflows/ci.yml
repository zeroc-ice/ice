name: Expat testing-feed validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: IceGrid ${{ matrix.platform }} ${{ matrix.configuration }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [Win32, x64]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-cpp
      - uses: ./.github/actions/setup-python
      - uses: ./.github/actions/setup-dotnet
      - name: Install test dependencies
        run: python -m pip install passlib cryptography
      - name: Restore Expat from the testing feed
        run: |
          nuget install ZeroC.Expat -Version 2.8.5 -ConfigFile NuGet.config -OutputDirectory cpp/msbuild/packages -NoCache -NonInteractive -Verbosity detailed
          if ($LASTEXITCODE -ne 0) { throw "Expat restore failed" }
          $package = "cpp/msbuild/packages/ZeroC.Expat.2.8.5"
          $version = (Get-Item "$package/build/native/bin/${{ matrix.platform }}/${{ matrix.configuration }}/libexpat*.dll").VersionInfo.FileVersion
          Write-Host "Expat DLL version: $version"
          if ($version -notmatch '^2[.,] ?8[.,] ?5') { throw "Unexpected Expat DLL version: $version" }
      - name: Build Ice C++
        run: msbuild cpp/msbuild/ice.proj /m /p:Platform=${{ matrix.platform }} /p:Configuration=${{ matrix.configuration }}
      - name: Run IceGrid tests
        working-directory: cpp
        run: python allTests.py --filter=IceGrid/ --platform=${{ matrix.platform }} --config=${{ matrix.configuration }} --workers=4 --continue
