name: CI

on:
  workflow_dispatch:
  push:
    branches: ["3.7"]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: ["3.7"]

# See https://docs.github.com/en/actions/using-jobs/using-concurrency#example-using-a-fallback-value
concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  # Configure the various build systems to treat warnings as errors
  WARNINGS_AS_ERRORS: yes

jobs:
  ci:
    name: ${{ matrix.config }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Release builds
          - os: ubuntu-24.04
            config: release
            cross_test_flags: "--all-cross"

          - os: windows-2025
            config: release
            build_flags: "/p:Platform=x64 /p:Configuration=Release"
            cross_test_flags: "--all-cross --platform=x64"

          - os: macos-26
            config: release
            cross_test_flags: "--all-cross"

          # C++11 release builds
          - os: ubuntu-24.04
            config: cpp11-release
            build_flags: "CONFIGS=cpp11-shared"
            test_flags: "--config=cpp11-shared"
            working_directory: cpp

          - os: windows-2025
            config: cpp11-release
            msbuild_project: "msbuild/ice.proj"
            build_flags: "/t:BuildCpp11 /p:Platform=x64 /p:Configuration=Release"
            test_flags: "--platform=x64 --config Cpp11-Release"
            working_directory: cpp

          - os: macos-26
            config: cpp11-release
            build_flags: "CONFIGS=cpp11-shared"
            test_flags: "--config=cpp11-shared"
            working_directory: cpp

          # JavaScript in Chrome, Firefox, and Safari, each in its own test step.
          - os: macos-26
            config: browser
            build_flags: "LANGUAGES='cpp python js'"

          # MATLAB
          - os: ubuntu-24.04
            config: "matlab"

            # We need both configurations:
            # - shared: for Python C++98 based mapping
            # - cpp11-shared: for MATLAB C++11 based mapping
            build_flags: "CONFIGS='shared cpp11-shared'"
            working_directory: matlab
            build_cpp_and_python: true

          - os: windows-2025
            config: "matlab"
            working_directory: matlab
            build_flags: "/p:Platform=x64 /p:Configuration=Release"
            msbuild_project: "msbuild/ice.proj"
            test_flags: "--platform=x64"
            build_cpp_and_python: true

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup C++
        uses: ./.github/actions/setup-cpp

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
        with:
          include_net10: 'true'

      - name: Setup Python
        uses: ./.github/actions/setup-python

      - name: Setup PHP
        uses: ./.github/actions/setup-php

      - name: Setup Java
        uses: ./.github/actions/setup-java

      - name: Setup MATLAB
        uses: ./.github/actions/setup-matlab
        if: matrix.config == 'matlab'

      - name: Setup MATLAB Build Environment
        if: matrix.config == 'matlab' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-11
          echo "CXX=g++-11" >> $GITHUB_ENV
          echo "USE_MATLAB_SSL=yes" >> $GITHUB_ENV
        shell: bash

      - name: Build ${{ matrix.config }} on ${{ matrix.os }}
        uses: ./.github/actions/build
        with:
          cpp11_mapping: ${{ matrix.config == 'cpp11-release' && 'true' || 'false' }}
          working_directory: ${{ matrix.working_directory }}
          build_flags: ${{ matrix.build_flags  }}
          msbuild_project: ${{ matrix.msbuild_project }}
          build_cpp_and_python: ${{ matrix.build_cpp_and_python }}
        timeout-minutes: 90

      - name: Install testing dependencies from pip
        run: python3 -m pip install passlib cryptography numpy
        shell: bash

      # Safari, unlike Chrome and Firefox, can't be told to accept the test CA's certificates, so trust the test CA.
      - name: Setup browser testing
        if: matrix.config == 'browser'
        run: |
          python3 -m pip install selenium
          sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain certs/cacert.pem
        shell: bash

      - name: Test ${{ matrix.config }} on ${{ matrix.os }}
        if: matrix.config != 'browser'
        uses: ./.github/actions/test
        timeout-minutes: 45
        with:
          flags: "--all ${{ matrix.test_flags }}"
          working_directory: ${{ matrix.working_directory || '.' }}

      - name: Test ${{ matrix.config }} in Chrome on ${{ matrix.os }}
        if: matrix.config == 'browser'
        uses: ./.github/actions/test
        timeout-minutes: 30
        with:
          flags: "--all --languages=js --browser=Chrome"

      - name: Test ${{ matrix.config }} in Firefox on ${{ matrix.os }}
        if: ${{ !cancelled() && matrix.config == 'browser' }}
        uses: ./.github/actions/test
        timeout-minutes: 30
        with:
          flags: "--all --languages=js --browser=Firefox"

      - name: Test ${{ matrix.config }} in Safari on ${{ matrix.os }}
        if: ${{ !cancelled() && matrix.config == 'browser' }}
        uses: ./.github/actions/test
        timeout-minutes: 30
        with:
          flags: "--all --languages=js --browser=Safari"

      - name: Cross Test ${{ matrix.config }} on ${{ matrix.os }}
        uses: ./.github/actions/test
        timeout-minutes: 45
        with:
          flags: ${{ matrix.cross_test_flags }}
          working_directory: ${{ matrix.working_directory || '.' }}
        if: matrix.cross_test_flags != ''

      - name: Upload test logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-${{ matrix.config }}-${{ matrix.os }}
          path: ${{ '.' }}/**/*.log
          if-no-files-found: ignore
        if: always()

      - name: Upload macOS crash diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crash-diagnostics-${{ matrix.config }}-${{ matrix.os }}
          path: ~/Library/Logs/DiagnosticReports/*.ips
          if-no-files-found: ignore
        if: runner.os == 'macOS' && always()
