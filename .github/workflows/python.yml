name: Python

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: ["main"]

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: ./.github/actions/setup-python

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check . --ignore E402

      - name: Ruff format
        run: ruff format . --check --diff

  pyright:
    name: Pyright
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup C++
        uses: ./.github/actions/setup-cpp

      - name: Setup Python
        uses: ./.github/actions/setup-python

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install Python dependencies
        working-directory: python
        run: uv sync --group dev

      - name: Build Ice for Python
        run: |
          make -C cpp srcs
          make -C python

      # --project points pyright at the repository root configuration, which covers both the Ice for
      # Python sources and the test framework in scripts.
      - name: Pyright check
        working-directory: python
        run: |
          uv run pyright --project ..
