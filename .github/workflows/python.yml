name: Python

on:
  workflow_dispatch:
  push:
    branches: ["3.8"]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: ["3.8"]

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Ruff is a self-contained binary, so this job needs no Python setup. version-file pins the
      # version to the one locked in python/uv.lock, which Dependabot's uv ecosystem keeps current.
      - name: Ruff check
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version-file: python/uv.lock
          args: check --ignore E402

      - name: Ruff format
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version-file: python/uv.lock
          args: format --check --diff

  pyright:
    name: Pyright
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup C++
        uses: ./.github/actions/setup-cpp

      - name: Setup Python
        uses: ./.github/actions/setup-python

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Install Python dependencies
        working-directory: python
        run: uv sync --group dev

      - name: Build Ice for Python
        run: |
          make -C cpp srcs
          make -C python

      # --project points pyright at the repository root configuration, which covers both the Ice for
      # Python sources and the test framework in scripts.
      - name: Pyright check
        working-directory: python
        run: |
          uv run pyright --project ..

      - name: Check the IcePy stub against the IcePy module
        working-directory: python
        run: |
          PYTHONPATH=python uv run python ../scripts/checkIcePyStub.py
