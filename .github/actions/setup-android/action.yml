name: Setup Android
description: Setup Android SDK and Emulator

inputs:
  platform:
    description: >
      Android SDK platform whose system image the emulators boot, in sdkmanager's naming (android-36
      for Android 16, android-37.1 for Android 17). Exported as $ANDROID_PLATFORM for setup-android-bt
      and the test harness, so one matrix value drives every emulator in the job.
    default: "android-36"
  image_tag:
    description: >
      The system image's tag, the middle part of its sdkmanager name: google_apis, or
      google_apis_ps16k where that is the only google_apis image a platform ships (android-37.1).
      Exported as $ANDROID_IMAGE_TAG alongside $ANDROID_PLATFORM.
    default: "google_apis"

runs:
  using: "composite"
  steps:
    # See https://github.com/marketplace/actions/android-emulator-runner
    - name: Enable KVM group perms
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Android SDK and PATH
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
        IMAGE_TAG: ${{ inputs.image_tag }}
      run: |
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_HOME/emulator" >> $GITHUB_PATH
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
        # For some reason avdmanager is placing the avd into $HOME/.config/.android/avd instead of $HOME/.android/avd
        echo "ANDROID_AVD_HOME=$HOME/.config/.android" >> $GITHUB_ENV
        # Both read by the step below, by setup-android-bt (--bt-image) and by scripts/Util.py
        # (JavaMapping.getSDKPackage), so every emulator in the job boots the same image.
        echo "ANDROID_PLATFORM=$PLATFORM" >> $GITHUB_ENV
        echo "ANDROID_IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

    - name: Configure Android SDK
      shell: bash
      run: |
        # platform-tools, build-tools, and platforms are pre-installed on GitHub runners
        # We only need to install the system image for the emulator, plus the emulator itself:
        # API 37 images need emulator 36.6.11 or newer, which the runner's copy may predate.
        # sdkmanager is a no-op for a package that is already current.
        if [ "$(uname -m)" = "aarch64" ]; then
          ARCH="arm64-v8a"
        else
          ARCH="x86_64"
        fi
        sdkmanager "emulator" "system-images;$ANDROID_PLATFORM;$ANDROID_IMAGE_TAG;$ARCH"
