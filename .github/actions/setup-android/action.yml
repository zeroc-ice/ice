name: Setup Android
description: Setup Android SDK and Emulator

inputs:
  platform:
    description: >
      Android SDK platform whose system image the emulators boot, in sdkmanager's naming.
      For example: `android-36` for Android 16, and `android-37.0` for Android 17.
    default: "android-36"

runs:
  using: "composite"
  steps:
    # See https://github.com/marketplace/actions/android-emulator-runner
    - name: Enable KVM group perms
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Android SDK and PATH
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
      run: |
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_HOME/emulator" >> $GITHUB_PATH
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
        echo "ANDROID_PLATFORM=$PLATFORM" >> $GITHUB_ENV
        # For some reason avdmanager is placing the avd into $HOME/.config/.android/avd instead of $HOME/.android/avd
        echo "ANDROID_AVD_HOME=$HOME/.config/.android" >> $GITHUB_ENV
        # Workaround for JDK-8349988 which can cause NPE in the JDK's Linux cgroup detection.
        # Hosted runners are plain VMs, not resource-limited containers, so detection buys nothing.
        # We disable it for all JVMs in this job via JAVA_TOOL_OPTIONS which they read at startup.
        echo "JAVA_TOOL_OPTIONS=-XX:-UseContainerSupport" >> "$GITHUB_ENV"

    - name: Configure Android SDK
      shell: bash
      run: |
        # platform-tools, build-tools, and platforms are pre-installed on GitHub runners.
        # We only need to install the emulator itself and a system image for it to boot into.
        # Note: some runners will already have an emulator installed, but it may not be the version we want.
        if [ "$(uname -m)" = "aarch64" ]; then
          ARCH="arm64-v8a"
        else
          ARCH="x86_64"
        fi
        sdkmanager "emulator" "system-images;$ANDROID_PLATFORM;google_apis;$ARCH"
