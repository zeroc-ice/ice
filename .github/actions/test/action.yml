name: Test Ice
description: Runs the Ice test suite using allTests.py with parallel workers and XML report generation.

inputs:
  working_directory:
    description: "The working directory to run the tests in"

  flags:
    description: "Flags to pass to the test"
    default: ""

  workers:
    description: "How many tests to run in parallel"
    default: "4"

  all:
    description: "Run each test case under every configuration it supports"
    default: "true"

runs:
  using: "composite"
  # flags is a shell fragment, such as "--languages='cpp,swift' --controller-app", so the steps expand it in place.
  steps:
    - name: Test
      working-directory: ${{ inputs.working_directory }}
      # zizmor: ignore[template-injection]
      run: python3 allTests.py --debug ${{ inputs.all == 'true' && '--all' || '' }} --keep-logs --continue --workers=${{ inputs.workers }} --export-xml=test-report.xml ${{ inputs.flags }}
      shell: bash
      if: runner.os == 'macOS'

    - name: Test
      working-directory: ${{ inputs.working_directory }}
      # zizmor: ignore[template-injection]
      run: |
        ulimit -c unlimited
        python3 allTests.py --debug ${{ inputs.all == 'true' && '--all' || '' }} --keep-logs --continue --workers=${{ inputs.workers }} --export-xml=test-report.xml ${{ inputs.flags }}
      shell: bash
      if: runner.os == 'Linux'

    - name: Test
      working-directory: ${{ inputs.working_directory }}
      # zizmor: ignore[template-injection]
      run: python allTests.py --debug ${{ inputs.all == 'true' && '--all' || '' }} --keep-logs --continue --workers=${{ inputs.workers }} --export-xml=test-report.xml ${{ inputs.flags }}
      shell: powershell
      if: runner.os == 'Windows'
