name: Setup Java
description: Installs Oracle Java 17 using the actions/setup-java action.
runs:
  using: "composite"
  steps:
    - name: Setup Oracle Java 17
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: "oracle"
        java-version: "17"
