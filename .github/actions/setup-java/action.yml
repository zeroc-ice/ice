name: Setup Java
description: Installs Oracle Java 17 using the actions/setup-java action.
runs:
  using: "composite"
  steps:
    - name: Setup Oracle Java 17
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: "oracle"
        java-version: "17"
