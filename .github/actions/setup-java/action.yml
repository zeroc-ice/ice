name: Setup Java
description: Installs Oracle Java 17 using the actions/setup-java action.
runs:
  using: "composite"
  steps:
    - name: Setup Oracle Java 17
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: "oracle"
        java-version: "17"
